name: Build RKN

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: rkn-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Progect1

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}
    env:
      VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Progect1/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri release
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RKN-${{ matrix.arch }}
          path: |
            Progect1/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            Progect1/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
