name: Windows Test Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rkn-windows-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  build-windows-test:
    name: Build Windows Test Bundle
    runs-on: windows-latest
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run version:check

      - name: Resolve test build metadata
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build Tauri Windows test bundle
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles app

      - name: Locate Windows test bundle
        id: package
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          app_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/app"

          if [[ ! -d "${app_dir}" ]]; then
            echo "Expected Windows app bundle directory was not produced."
            exit 1
          fi

          bundle_root="$(find "${app_dir}" -mindepth 1 -maxdepth 1 | head -n 1)"

          if [[ -z "${bundle_root}" ]]; then
            echo "Expected Windows app bundle contents were not produced."
            exit 1
          fi

          echo "bundle_path=${bundle_root}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=RKN-${version}-windows-test-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: ${{ steps.package.outputs.bundle_path }}
          retention-days: 14
          compression-level: 0
