name: Windows Test Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rkn-windows-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  build-windows-test:
    name: Build Windows Test Installer
    runs-on: windows-latest
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run version:check

      - name: Resolve test build metadata
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build Tauri Windows test release
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Normalize Windows test artifact names
        id: package
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          release_dir="dist/test-release/windows-x64"
          nsis_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"

          mkdir -p "${release_dir}"

          setup_src="$(find "${nsis_dir}" -maxdepth 1 -name '*.exe' | head -n 1)"

          if [[ -z "${setup_src}" ]]; then
            echo "Expected Windows NSIS .exe artifact was not produced."
            exit 1
          fi

          setup_name="RKN-${version}-windows-test-${short_sha}.exe"
          cp "${setup_src}" "${release_dir}/${setup_name}"

          echo "setup_path=${release_dir}/${setup_name}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=RKN-${version}-windows-test-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: ${{ steps.package.outputs.setup_path }}
          retention-days: 14
          compression-level: 0
