name: RKN Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rkn-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Progect1

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Progect1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build-check

      - name: Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
