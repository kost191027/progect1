name: RKN Checks

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: rkn-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run version:check

      - name: TypeScript build check
        run: npm run build-check

  rust-check-macos:
    runs-on: macos-14
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run version:check

      - name: Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  android-kotlin-quality:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD: ${{ github.run_number }}
      VITE_GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Android Kotlin quality gate
        run: npm run android:kotlin:check
